name: CI Gate — Protect Main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── GATE 1: LINT & FORMAT ─────────────────────────
  lint:
    name: "Gate 1: Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Biome Check (lint + format)
        run: pnpm exec biome check --error-on-warnings ./src 2>&1 | tee /tmp/lint-output.txt

      - name: Format verification
        run: pnpm exec biome format --check ./src 2>&1 | tee -a /tmp/lint-output.txt

      - name: Upload lint output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: /tmp/lint-output.txt

  # ─── GATE 2: TYPECHECK ─────────────────────────────
  typecheck:
    name: "Gate 2: TypeScript Strict Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Generate routes (TanStack Router)
        run: pnpm run generate-routes

      - name: Strict typecheck
        run: pnpm exec tsc --noEmit --pretty 2>&1 | tee /tmp/tsc-output.txt

      - name: Upload tsc output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-output
          path: /tmp/tsc-output.txt

  # ─── GATE 3: TESTS ─────────────────────────────────
  test:
    name: "Gate 3: Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Run tests
        run: pnpm test -- --reporter=verbose 2>&1 | tee /tmp/test-output.txt

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: /tmp/test-output.txt

  # ─── GATE 4: BUILD ─────────────────────────────────
  build:
    name: "Gate 4: Build Verification"
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Generate routes
        run: pnpm run generate-routes

      - name: Build
        run: pnpm run build 2>&1 | tee /tmp/build-output.txt
        env:
          NODE_ENV: production

      - name: Upload build output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: /tmp/build-output.txt

  # ─── GATE 5: SCHEMA CHECK ──────────────────────────
  schema-check:
    name: "Gate 5: Schema & Migration Safety"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Check for schema drift
        run: |
          # Generate migrations from current schema to a temp dir
          pnpm exec drizzle-kit generate 2>&1 | tee /tmp/schema-output.txt

          # If new migration files were generated, schema is out of sync
          if git diff --name-only | grep -q 'drizzle/'; then
            echo "" | tee -a /tmp/schema-output.txt
            echo "❌ ERROR: Schema changes detected without committed migrations!" | tee -a /tmp/schema-output.txt
            echo "" | tee -a /tmp/schema-output.txt
            echo "Your schema.ts has changes that don't match the committed migrations." | tee -a /tmp/schema-output.txt
            echo "Run 'pnpm db:generate' locally and commit the generated migration files." | tee -a /tmp/schema-output.txt
            exit 1
          fi
        env:
          DATABASE_URL: ":memory:"

      - name: Upload schema output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-output
          path: /tmp/schema-output.txt

  # ─── GATE 6: SECURITY ──────────────────────────────
  security-audit:
    name: "Gate 6: Security Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high 2>&1 | tee /tmp/security-output.txt
        continue-on-error: true

      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Check for .env files in commit
        run: |
          if git diff --name-only origin/main...HEAD 2>/dev/null | grep -E '\.env($|\.)' | grep -v '.env.example'; then
            echo "❌ ERROR: .env file detected in PR! Never commit secrets." | tee -a /tmp/security-output.txt
            exit 1
          fi

      - name: Upload security output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-output
          path: /tmp/security-output.txt

  # ─── UNIFIED CI STATUS REPORT ──────────────────────
  report:
    name: "📋 CI Report"
    needs: [lint, typecheck, test, build, schema-check, security-audit]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all failure artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/ci-outputs
        continue-on-error: true

      - name: Post or update CI report on PR
        uses: actions/github-script@v7
        env:
          STATUS_LINT: ${{ needs.lint.result }}
          STATUS_TYPECHECK: ${{ needs.typecheck.result }}
          STATUS_TEST: ${{ needs.test.result }}
          STATUS_BUILD: ${{ needs.build.result }}
          STATUS_SCHEMA: ${{ needs['schema-check'].result }}
          STATUS_SECURITY: ${{ needs['security-audit'].result }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const BOT_TAG = '<!-- CI-STATUS-REPORT-BOT -->';
            const results = {
              lint: process.env.STATUS_LINT,
              typecheck: process.env.STATUS_TYPECHECK,
              test: process.env.STATUS_TEST,
              build: process.env.STATUS_BUILD,
              schema: process.env.STATUS_SCHEMA,
              security: process.env.STATUS_SECURITY,
            };

            const hasFailure = Object.values(results).some(r => r === 'failure' || r === 'cancelled');

            const gates = [
              { id: 'lint', name: '🎨 Gate 1: Lint & Format', dir: 'lint-output', fix: 'Run `pnpm exec biome check --write ./src` to auto-fix lint and formatting issues' },
              { id: 'typecheck', name: '🔷 Gate 2: TypeScript Strict', dir: 'tsc-output', fix: 'Run `pnpm exec tsc --noEmit` locally and fix all type errors shown' },
              { id: 'test', name: '🧪 Gate 3: Unit Tests', dir: 'test-output', fix: 'Run `pnpm test` locally and fix failing tests' },
              { id: 'build', name: '🏗️ Gate 4: Build Verification', dir: 'build-output', fix: 'Run `pnpm run build` locally to reproduce and fix the build error' },
              { id: 'schema', name: '📐 Gate 5: Schema Safety', dir: 'schema-output', fix: 'Run `pnpm db:generate` and commit the generated migration file' },
              { id: 'security', name: '🔒 Gate 6: Security Audit', dir: 'security-output', fix: 'Run `pnpm audit` and update vulnerable packages; verify no .env/secrets committed' },
            ];

            let report = `${BOT_TAG}\n`;

            if (!hasFailure) {
              report += `## ✅ All CI Gates Passed — Ready to Merge\n\n`;
              report += `All automated checks completed successfully for this pull request:\n\n`;
              report += `| Gate | Status |\n|---|:---:|\n`;
              for (const gate of gates) {
                report += `| ${gate.name} | ✅ Passed |\n`;
              }
              report += `\n| Detail | Value |\n|---|---|\n`;
              report += `| **Branch** | \`${context.payload.pull_request.head.ref}\` |\n`;
              report += `| **Author** | @${context.payload.pull_request.user.login} |\n`;
              report += `| **Commit** | \`${context.payload.pull_request.head.sha.slice(0, 7)}\` |\n\n`;
              report += `> This PR is healthy and cleared for code review and merge. 🚀\n`;
            } else {
              report += `## ❌ CI Checks Failed — Merge Blocked\n\n`;
              report += `One or more automated gates failed. Please fix the issues below before merging:\n\n`;
              report += `| Gate | Status |\n|---|:---:|\n`;
              for (const gate of gates) {
                const status = results[gate.id] === 'success' ? '✅ Passed' : results[gate.id] === 'failure' ? '❌ Failed' : '⏭️ Skipped';
                report += `| ${gate.name} | ${status} |\n`;
              }
              report += `\n---\n\n`;

              let failDetails = 0;
              for (const gate of gates) {
                const dir = path.join('/tmp/ci-outputs', gate.dir);
                try {
                  if (fs.existsSync(dir)) {
                    const files = fs.readdirSync(dir);
                    for (const file of files) {
                      const content = fs.readFileSync(path.join(dir, file), 'utf8');
                      if (content.trim()) {
                        failDetails++;
                        report += `### ${gate.name}\n\n`;
                        report += `<details open><summary>Click to view error log</summary>\n\n`;
                        report += '```\n' + content.slice(-4000) + '\n```\n\n';
                        report += `</details>\n\n`;
                        report += `**🔧 How to fix:** ${gate.fix}\n\n---\n\n`;
                      }
                    }
                  }
                } catch {
                  // ignore
                }
              }

              report += `### 🛠️ How to Resolve:\n\n`;
              report += `1. Pull the branch locally: \`git checkout ${context.payload.pull_request.head.ref}\`\n`;
              report += `2. Run the fixes indicated above\n`;
              report += `3. Verify locally:\n`;
              report += `   \`\`\`bash\n`;
              report += `   pnpm exec biome check --write ./src  # lint & format\n`;
              report += `   pnpm exec tsc --noEmit               # strict types\n`;
              report += `   pnpm test                             # unit tests\n`;
              report += `   pnpm run build                        # production build\n`;
              report += `   \`\`\`\n`;
              report += `4. Push your commits — CI will automatically re-run and update this report.\n`;
            }

            // Find existing bot comment to update, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(BOT_TAG));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: report,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: report,
              });
            }
