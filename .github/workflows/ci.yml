name: CI Gate — Protect Main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── GATE 1: LINT & FORMAT ─────────────────────────
  lint:
    name: "Gate 1: Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome Check (lint + format)
        run: pnpm exec biome check --error-on-warnings ./src 2>&1 | tee /tmp/lint-output.txt

      - name: Format verification
        run: pnpm exec biome format --check ./src 2>&1 | tee -a /tmp/lint-output.txt

      - name: Upload lint output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: /tmp/lint-output.txt

  # ─── GATE 2: TYPECHECK ─────────────────────────────
  typecheck:
    name: "Gate 2: TypeScript Strict Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate routes (TanStack Router)
        run: pnpm run generate-routes

      - name: Strict typecheck
        run: pnpm exec tsc --noEmit --pretty 2>&1 | tee /tmp/tsc-output.txt

      - name: Upload tsc output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-output
          path: /tmp/tsc-output.txt

  # ─── GATE 3: TESTS ─────────────────────────────────
  test:
    name: "Gate 3: Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test -- --reporter=verbose 2>&1 | tee /tmp/test-output.txt

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: /tmp/test-output.txt

  # ─── GATE 4: BUILD ─────────────────────────────────
  build:
    name: "Gate 4: Build Verification"
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate routes
        run: pnpm run generate-routes

      - name: Build
        run: pnpm run build 2>&1 | tee /tmp/build-output.txt
        env:
          NODE_ENV: production

      - name: Upload build output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: /tmp/build-output.txt

  # ─── GATE 5: SCHEMA CHECK ──────────────────────────
  schema-check:
    name: "Gate 5: Schema & Migration Safety"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for schema drift
        run: |
          # Generate migrations from current schema to a temp dir
          pnpm exec drizzle-kit generate 2>&1 | tee /tmp/schema-output.txt

          # If new migration files were generated, schema is out of sync
          if git diff --name-only | grep -q 'drizzle/'; then
            echo "" | tee -a /tmp/schema-output.txt
            echo "❌ ERROR: Schema changes detected without committed migrations!" | tee -a /tmp/schema-output.txt
            echo "" | tee -a /tmp/schema-output.txt
            echo "Your schema.ts has changes that don't match the committed migrations." | tee -a /tmp/schema-output.txt
            echo "Run 'pnpm db:generate' locally and commit the generated migration files." | tee -a /tmp/schema-output.txt
            exit 1
          fi
        env:
          DATABASE_URL: ":memory:"

      - name: Upload schema output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-output
          path: /tmp/schema-output.txt

  # ─── GATE 6: SECURITY ──────────────────────────────
  security-audit:
    name: "Gate 6: Security Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high 2>&1 | tee /tmp/security-output.txt
        continue-on-error: true

      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Check for .env files in commit
        run: |
          if git diff --name-only origin/main...HEAD 2>/dev/null | grep -E '\.env($|\.)' | grep -v '.env.example'; then
            echo "❌ ERROR: .env file detected in PR! Never commit secrets." | tee -a /tmp/security-output.txt
            exit 1
          fi

      - name: Upload security output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-output
          path: /tmp/security-output.txt

  # ─── CHANGE IMPACT STATS ───────────────────────────
  diff-stats:
    name: "Gate 7: Change Impact"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff stats
        run: |
          echo "### 📊 Change Impact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git diff --stat origin/main...HEAD >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files changed:** $(git diff --name-only origin/main...HEAD | wc -l | tr -d ' ')" >> $GITHUB_STEP_SUMMARY
          echo "**Lines added:** $(git diff origin/main...HEAD | grep '^+[^+]' | wc -l | tr -d ' ')" >> $GITHUB_STEP_SUMMARY
          echo "**Lines removed:** $(git diff origin/main...HEAD | grep '^-[^-]' | wc -l | tr -d ' ')" >> $GITHUB_STEP_SUMMARY

  # ─── FAILURE REPORT ────────────────────────────────
  report:
    name: "📋 Failure Report"
    needs: [lint, typecheck, test, build, schema-check, security-audit]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/ci-outputs
        continue-on-error: true

      - name: Post failure report to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let report = `## ❌ CI Failed — Merge to main is blocked\n\n`;
            report += `| | |\n|---|---|\n`;
            report += `| **Branch** | \`${context.payload.pull_request.head.ref}\` |\n`;
            report += `| **Author** | @${context.payload.pull_request.user.login} |\n`;
            report += `| **Commit** | \`${context.payload.pull_request.head.sha.slice(0, 7)}\` |\n\n`;
            report += `---\n\n`;

            const gates = [
              { name: '🎨 Gate 1: Lint & Format', dir: 'lint-output', fix: 'Run `pnpm exec biome check --write ./src` to auto-fix lint and formatting issues' },
              { name: '🔷 Gate 2: TypeScript', dir: 'tsc-output', fix: 'Run `pnpm exec tsc --noEmit` locally and fix all type errors shown' },
              { name: '🧪 Gate 3: Tests', dir: 'test-output', fix: 'Run `pnpm test` locally and fix failing tests' },
              { name: '🏗️ Gate 4: Build', dir: 'build-output', fix: 'Run `pnpm run build` locally to reproduce and fix the build error' },
              { name: '📐 Gate 5: Schema', dir: 'schema-output', fix: 'Run `pnpm db:generate` and commit the generated migration file' },
              { name: '🔒 Gate 6: Security', dir: 'security-output', fix: 'Run `pnpm audit` and update vulnerable packages, remove any .env files from git' },
            ];

            let failCount = 0;

            for (const gate of gates) {
              const dir = path.join('/tmp/ci-outputs', gate.dir);
              try {
                const files = fs.readdirSync(dir);
                for (const file of files) {
                  const content = fs.readFileSync(path.join(dir, file), 'utf8');
                  if (content.trim()) {
                    failCount++;
                    report += `### ${gate.name}\n\n`;
                    report += `<details><summary>Click to see errors</summary>\n\n`;
                    report += '```\n' + content.slice(-4000) + '\n```\n\n';
                    report += `</details>\n\n`;
                    report += `**🔧 Fix:** ${gate.fix}\n\n---\n\n`;
                  }
                }
              } catch {
                // Gate passed or no artifact — skip
              }
            }

            if (failCount === 0) {
              report += `> ⚠️ Could not retrieve detailed error output. Check the [CI logs](${context.payload.pull_request.html_url}/checks) directly.\n\n`;
            }

            report += `### ✅ How to fix and re-submit:\n\n`;
            report += `1. Pull this branch locally: \`git checkout ${context.payload.pull_request.head.ref}\`\n`;
            report += `2. Fix all issues listed above\n`;
            report += `3. Verify locally:\n`;
            report += `   \`\`\`bash\n`;
            report += `   pnpm exec biome check --write ./src  # fix lint\n`;
            report += `   pnpm exec tsc --noEmit               # fix types\n`;
            report += `   pnpm test                             # fix tests\n`;
            report += `   pnpm run build                        # verify build\n`;
            report += `   \`\`\`\n`;
            report += `4. Commit and push your fixes — CI will re-run automatically\n`;
            report += `5. Once all gates pass ✅, request a review\n`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: report
            });
